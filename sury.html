<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8a6ba">
  <title>A Tiny Apology</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Gaegu:wght@400;700&display=swap');

    :root {
      --ink: #3e1830;
      --berry: #b62d5c;
      --pink: #f8a6ba;
      --paper: #fffaf2;
      --yellow: #ffd86b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 18%, rgba(255,255,255,.7) 0 5%, transparent 5.2%),
        radial-gradient(circle at 88% 75%, rgba(255,216,107,.65) 0 9%, transparent 9.2%),
        linear-gradient(135deg, #ffc1cf 0%, #f58eaa 48%, #f6b584 100%);
      font-family: "DM Sans", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: .2;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
    }

    .hand { font-family: "Gaegu", cursive; }

    .doodle {
      position: fixed;
      font-family: "Gaegu", cursive;
      font-weight: 700;
      color: rgba(82, 23, 53, .55);
      user-select: none;
      pointer-events: none;
      animation: drift 5s ease-in-out infinite;
    }

    .note {
      width: min(680px, calc(100vw - 32px));
      min-height: 410px;
      position: relative;
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 12px 14px 0 rgba(86, 31, 58, .22);
      transform: rotate(-1.2deg) scale(.85);
      opacity: 0;
      animation: noteIn .7s cubic-bezier(.2,.9,.2,1.15) .25s forwards;
    }

    .note::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image: repeating-linear-gradient(transparent 0 37px, #efc4d0 38px 39px);
      background-position: 0 77px;
    }

    .tape {
      position: absolute;
      top: -19px;
      left: 50%;
      width: 116px;
      height: 38px;
      transform: translateX(-50%) rotate(2deg);
      background: rgba(255, 222, 105, .8);
      border-left: 2px dashed rgba(62, 24, 48, .18);
      border-right: 2px dashed rgba(62, 24, 48, .18);
      z-index: 2;
    }

    .cursor::after {
      content: "";
      display: inline-block;
      width: 3px;
      height: .9em;
      margin-left: 4px;
      vertical-align: -.05em;
      background: var(--berry);
      animation: blink .7s steps(1) infinite;
    }

    .modal-wrap {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(62, 24, 48, .35);
      backdrop-filter: blur(5px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease;
    }

    .modal-wrap.show { opacity: 1; visibility: visible; }

    .modal {
      width: min(430px, 100%);
      position: relative;
      padding: 34px 28px 28px;
      text-align: center;
      background: #fffaf2;
      border: 2px solid var(--ink);
      border-radius: 2px;
      box-shadow: 9px 9px 0 var(--ink);
      transform: translateY(24px) rotate(1deg);
      transition: transform .35s cubic-bezier(.2,.9,.2,1.25);
    }

    .modal-wrap.show .modal { transform: translateY(0) rotate(-.5deg); }

    .btn {
      min-width: 116px;
      padding: 12px 24px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--ink);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
    .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
    .btn:focus-visible { outline: 4px solid white; outline-offset: 3px; }
    .btn-yes { background: var(--yellow); }
    .btn-no { background: white; }

    .emoji-rain {
      position: fixed;
      z-index: 70;
      top: -12vh;
      pointer-events: none;
      animation: rain var(--speed) linear var(--delay) forwards;
      will-change: transform;
    }

    .success-screen {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: white;
      background: var(--berry);
      clip-path: circle(0 at 50% 50%);
      transition: clip-path .7s cubic-bezier(.7,0,.2,1);
      visibility: hidden;
    }

    .success-screen.show { visibility: visible; clip-path: circle(150vmax at 50% 50%); }
    .success-copy { animation: successPop .65s cubic-bezier(.2,.9,.2,1.25) .35s both; }

    .closing-curtain {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      color: #fffaf2;
      text-align: center;
      background: var(--ink);
      transform: translateY(100%);
      transition: transform .8s cubic-bezier(.7,0,.2,1);
    }

    .closing-curtain.show { transform: translateY(0); }

    @keyframes noteIn {
      to { transform: rotate(-1.2deg) scale(1); opacity: 1; }
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-12px) rotate(4deg); }
    }

    @keyframes blink { 50% { opacity: 0; } }

    @keyframes rain {
      0% { transform: translate3d(0, -10vh, 0) rotate(0deg); }
      100% { transform: translate3d(var(--drift), 125vh, 0) rotate(var(--spin)); }
    }

    @keyframes successPop {
      from { opacity: 0; transform: scale(.7) rotate(-4deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    @media (max-width: 640px) {
      .note { min-height: 470px; }
      .note-inner { padding: 50px 28px 30px !important; }
      .doodle { opacity: .55; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <span class="doodle text-5xl left-[4vw] top-[12vh]" aria-hidden="true">oops!</span>
  <span class="doodle text-4xl right-[5vw] top-[16vh]" style="animation-delay:-1.4s" aria-hidden="true">♡</span>
  <span class="doodle text-3xl left-[7vw] bottom-[12vh]" style="animation-delay:-2.7s" aria-hidden="true">my bad...</span>
  <span class="doodle text-6xl right-[7vw] bottom-[10vh]" style="animation-delay:-.8s" aria-hidden="true">:(</span>

  <main class="relative z-10 min-h-screen grid place-items-center px-4 py-8" aria-live="polite">
    <article class="note" aria-label="An apology note">
      <div class="tape" aria-hidden="true"></div>
      <div class="note-inner relative z-1 p-12 sm:p-14">
        <div class="flex items-start justify-between gap-5 mb-7">
          <div>
            <p class="text-xs font-bold uppercase tracking-[.24em] text-[#b62d5c] mb-2">A tiny peace offering</p>
            <h1 class="hand text-5xl sm:text-6xl leading-none font-bold">I'm sorry.</h1>
          </div>
          <div class="hand text-4xl rotate-6" aria-hidden="true">♥</div>
        </div>

        <div class="min-h-[190px] sm:min-h-[160px]">
          <p id="typedText" class="hand cursor text-[1.7rem] sm:text-[2rem] leading-[1.2] font-bold" aria-label="Apology message"></p>
        </div>

        <div class="mt-6 flex items-end justify-between gap-4">
          <p class="text-sm opacity-60">Written with 100% genuine regret</p>
          <p class="hand text-3xl -rotate-3">pretty please?</p>
        </div>
      </div>
    </article>
  </main>

  <div id="questionModal" class="modal-wrap" role="dialog" aria-modal="true" aria-labelledby="questionTitle">
    <div class="modal">
      <div id="modalEmoji" class="text-6xl mb-3" aria-hidden="true">🥺</div>
      <p class="text-xs font-bold uppercase tracking-[.2em] text-[#b62d5c] mb-2">Important question</p>
      <h2 id="questionTitle" class="hand text-5xl font-bold leading-none mb-3">Do you forgive me?</h2>
      <p id="questionHint" class="mb-7 opacity-65">I promise to do better.</p>
      <div id="buttonArea" class="relative flex min-h-[58px] items-center justify-center gap-4">
        <button id="yesBtn" class="btn btn-yes" type="button">Yes!</button>
        <button id="noBtn" class="btn btn-no" type="button">No</button>
      </div>
    </div>
  </div>

  <section id="successScreen" class="success-screen" aria-hidden="true">
    <div class="success-copy relative z-10">
      <p class="hand text-7xl sm:text-9xl font-bold leading-none">YAY!</p>
      <h2 class="mt-4 text-2xl sm:text-3xl font-bold">You just made my whole day.</h2>
      <p class="mt-3 text-lg text-white/75">Thank you for forgiving me!</p>
    </div>
  </section>

  <div id="closingCurtain" class="closing-curtain" aria-live="polite">
    <div>
      <p class="hand text-6xl font-bold">Apology accepted ♥</p>
      <p class="mt-3 text-white/60">This little note can close happy now.</p>
    </div>
  </div>

  <script>
    // Change these two messages to make the apology your own.
    const firstMessage = "I messed up, and I hate that I hurt you. You mean far too much to me for me not to say this properly: I am truly, honestly sorry.";
    const secondMessage = "Okay... I understand. But I am not giving up on making this right. Can I have one tiny chance to earn back your smile?";

    const typedText = document.getElementById("typedText");
    const modal = document.getElementById("questionModal");
    const modalEmoji = document.getElementById("modalEmoji");
    const questionTitle = document.getElementById("questionTitle");
    const questionHint = document.getElementById("questionHint");
    const buttonArea = document.getElementById("buttonArea");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const successScreen = document.getElementById("successScreen");
    const closingCurtain = document.getElementById("closingCurtain");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let typingTimer;
    let secondChance = false;
    let noMoves = 0;

    function typeMessage(message, onComplete) {
      clearTimeout(typingTimer);
      typedText.textContent = "";
      let index = 0;

      const tick = () => {
        typedText.textContent = message.slice(0, index);
        index += 1;
        if (index <= message.length) {
          const char = message[index - 1];
          const pause = /[.!?]/.test(char) ? 180 : /[,;]/.test(char) ? 90 : 28 + Math.random() * 28;
          typingTimer = setTimeout(tick, reduceMotion ? 1 : pause);
        } else {
          setTimeout(onComplete, reduceMotion ? 20 : 650);
        }
      };

      tick();
    }

    function showQuestion() {
      modal.classList.add("show");
      setTimeout(() => yesBtn.focus(), 350);
    }

    function hideQuestion() {
      modal.classList.remove("show");
    }

    function askAgain() {
      secondChance = true;
      modalEmoji.textContent = "🥹";
      questionTitle.textContent = "How about now?";
      questionHint.textContent = "The sad eyes are non-negotiable.";
      noBtn.textContent = "Still no";
      noBtn.setAttribute("aria-label", "No, but this button will run away");
      buttonArea.style.minHeight = "122px";
      showQuestion();
    }

    function handleNo() {
      if (secondChance) {
        moveNoButton();
        return;
      }

      hideQuestion();
      setTimeout(() => typeMessage(secondMessage, askAgain), 320);
    }

    function moveNoButton() {
      noMoves += 1;
      const areaRect = buttonArea.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();
      const maxX = Math.max(10, areaRect.width - btnRect.width);
      const maxY = Math.max(10, areaRect.height - btnRect.height);
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.position = "absolute";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.transform = `rotate(${Math.random() * 18 - 9}deg)`;
      questionHint.textContent = noMoves > 2 ? "Nice try. Only yes works now." : "Oops, that button seems shy.";
    }

    function makeEmojiRain() {
      const emojis = ["🎉", "🥳", "💖", "✨", "🎊", "💐", "💕", "🌟"];
      const count = reduceMotion ? 28 : 100;

      for (let i = 0; i < count; i += 1) {
        const piece = document.createElement("span");
        piece.className = "emoji-rain";
        piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.fontSize = 20 + Math.random() * 30 + "px";
        piece.style.setProperty("--speed", 2.4 + Math.random() * 2.8 + "s");
        piece.style.setProperty("--delay", Math.random() * 1.8 + "s");
        piece.style.setProperty("--drift", Math.random() * 180 - 90 + "px");
        piece.style.setProperty("--spin", Math.random() * 900 - 450 + "deg");
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 7000);
      }
    }

    function celebrate() {
      hideQuestion();
      successScreen.classList.add("show");
      successScreen.setAttribute("aria-hidden", "false");
      makeEmojiRain();

      setTimeout(() => {
        closingCurtain.classList.add("show");
        setTimeout(() => {
          // Browsers only allow scripts to close tabs that were opened by scripts.
          window.close();
        }, 1000);
      }, reduceMotion ? 1800 : 5000);
    }

    yesBtn.addEventListener("click", celebrate);
    noBtn.addEventListener("click", handleNo);
    noBtn.addEventListener("pointerenter", () => {
      if (secondChance) moveNoButton();
    });
    noBtn.addEventListener("focus", () => {
      if (secondChance && noMoves > 0) moveNoButton();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modal.classList.contains("show")) {
        event.preventDefault();
      }
    });

    setTimeout(() => typeMessage(firstMessage, showQuestion), reduceMotion ? 10 : 900);
  </script>
</body>
</html>
